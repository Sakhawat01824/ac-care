<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e5a66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AC Care">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Expert AC Care Engineering</title>
<style>
:root{--ink:#12303b;--tl:#0e5a66;--bg:#eef5f7;--w:#fff;--am:#c77d00;--rd:#b3261e;--ln:#d3e1e5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans Bengali","Kohinoor Bangla","Bangla Sangam MN",system-ui,sans-serif;padding-bottom:90px}
header{background:var(--tl);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px}
nav{display:flex;gap:6px;padding:10px 12px}
nav button,.seg button{flex:1;background:var(--w);color:var(--tl);border:1px solid var(--ln)}
nav button.on,.seg button.on{background:var(--tl);color:#fff}
main{padding:0 12px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--tl);color:#fff}
button.g{background:#e3edf0;color:var(--ink)}button.r{background:#fbe4e2;color:var(--rd)}button.s{padding:4px 10px;font-size:14px}
input,select{width:100%;font:inherit;padding:10px;border:1px solid var(--ln);border-radius:10px;background:#fff;margin-top:4px}
.card{display:flex;gap:12px;align-items:center;background:var(--w);border-radius:12px;padding:12px;margin:8px 0;border:1px solid var(--ln)}
.card>div{flex:1;min-width:0}.card b,.card small{display:block}small{color:#5b7580}
.card img,.card i{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--tl);color:#fff;display:grid;place-items:center;font-style:normal;font-size:20px}
.card em{font-style:normal;color:var(--rd);font-weight:700}
.box{background:var(--w);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:10px 0}
.box h3{margin:0 0 6px;font-size:16px}.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.row>*{flex:1}
.sum{display:flex;justify-content:space-between;gap:6px;text-align:center}.sum div{flex:1;background:var(--bg);border-radius:8px;padding:6px}
.due{color:var(--rd);font-weight:700}.ok{color:var(--tl)}.late{color:var(--rd)}.soon{color:var(--am)}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 18px);width:58px;height:58px;border-radius:50%;font-size:30px;padding:0;background:var(--am);box-shadow:0 4px 12px #0004}
.ov{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
.sheet h3{margin:0 0 8px}.sheet label{display:block;margin-top:8px;font-size:14px;color:#5b7580}
.seg{display:flex;gap:6px;margin:6px 0}
.tkl{display:block;margin-top:8px;font-size:14px;color:#5b7580}.sheet .ck{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:16px;color:var(--ink)}.ck input{width:24px;height:24px;margin:0}
.sv{border-top:1px solid var(--ln);padding:8px 0}.sv:first-of-type{border:0}
.empty{text-align:center;color:#5b7580;padding:30px 10px}
</style>
</head>
<body>
<header><h1>Expert AC Care Engineering</h1></header>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const tk=n=>'৳'+bn(Number(n||0).toLocaleString('en-US'));
const dt=s=>s?bn(s.split('-').reverse().join('/')):'';
const today=()=>new Date().toLocaleDateString('sv');
const addM=(s,n)=>{const d=new Date(s+'T12:00:00');d.setMonth(d.getMonth()+n);return d.toLocaleDateString('sv')};
const days=(a,b)=>Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let db,L=[],V='list',F=3,CUR=null,Q='';
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('accare',1);r.onupgradeneeded=()=>r.result.createObjectStore('c',{keyPath:'id'});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)});
const st=m=>db.transaction('c',m).objectStore('c');
const rq=q=>new Promise((res,rej)=>{q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const load=async()=>{L=(await rq(st('readonly').getAll())).sort((a,b)=>a.code<b.code?-1:1)};
const save=async c=>{await rq(st('readwrite').put(c));await load();render()};
const last=c=>c.services.reduce((m,s)=>s.date>m?s.date:m,'');
const dueOf=c=>c.services.reduce((a,s)=>a+(s.bill-s.paid),0);
const acName=(c,id)=>{const a=c.acs.find(x=>x.id===id);return a?`${a.brand} ${a.model}`.trim():'এসি নির্দিষ্ট নয়'};

function photo(f){return new Promise(r=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const s=Math.min(1,600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.7))};i.src=u})}

function form(title,fields,init,onSave){
  const m=document.createElement('div');m.className='ov';
  m.innerHTML=`<form class="sheet"><h3>${title}</h3>${fields.map(f=>f.t==='tick'?`<div><span class="tkl">${f.l}</span>${f.o.map(o=>`<label class="ck"><input type="checkbox" name="${f.k}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('')}</div>`:`<label>${f.l}${f.t==='select'?`<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}</select>`:f.t==='photo'?`<input type="file" name="${f.k}" accept="image/*">`:`<input name="${f.k}" type="${f.t||'text'}" ${f.t==='number'?'inputmode="decimal" min="0"':''} ${f.r?'required':''}>`}</label>`).join('')}<div class="row"><button type="button" class="g" id="x">বাতিল</button><button>সংরক্ষণ</button></div></form>`;
  document.body.appendChild(m);
  fields.forEach(f=>{if(f.t==='tick'){const bs=[...m.querySelectorAll(`[name=${f.k}]`)];bs.forEach(b=>{b.checked=b.value===init[f.k];b.onchange=()=>{if(b.checked)bs.forEach(o=>{if(o!==b)o.checked=false})}})}else if(f.t!=='photo')m.querySelector(`[name=${f.k}]`).value=init[f.k]??''});
  $('#x').onclick=()=>m.remove();
  m.querySelector('form').onsubmit=async e=>{e.preventDefault();const v={};
    for(const f of fields){if(f.t==='tick'){const c=m.querySelector(`[name=${f.k}]:checked`);v[f.k]=c?c.value:'';continue}const el=m.querySelector(`[name=${f.k}]`);
      if(f.t==='photo'){if(el.files[0])v[f.k]=await photo(el.files[0])}
      else v[f.k]=f.t==='number'?Number(el.value||0):el.value.trim()}
    m.remove();await onSave(v)};
}

const card=c=>`<div class="card" data-a="open" data-id="${c.id}">${c.photo?`<img src="${c.photo}" alt="">`:`<i>${esc(c.name[0]||'?')}</i>`}<div><b>${esc(c.name)}</b><small>${esc(c.code)} · ${esc(c.phone)}</small>${last(c)?`<small>সর্বশেষ সার্ভিস: ${dt(last(c))}</small>`:''}</div>${dueOf(c)>0?`<em>${tk(dueOf(c))}</em>`:''}</div>`;
const filt=()=>{const q=Q.toLowerCase();return L.filter(c=>!q||[c.name,c.phone,c.code,c.address,...c.acs.flatMap(a=>[a.brand,a.model,a.serial])].join(' ').toLowerCase().includes(q))};
const listHtml=()=>{const r=filt();return r.length?r.map(card).join(''):`<div class="empty">${L.length?'কিছু পাওয়া যায়নি।':'কোনো কাস্টমার নেই। নিচের + বাটনে নতুন কাস্টমার যোগ করুন।'}</div>`};

function nav(){return `<nav>${[['list','কাস্টমার'],['follow','ফলোআপ'],['backup','ব্যাকআপ']].map(([k,t])=>`<button data-a="tab" data-v="${k}" class="${V===k?'on':''}">${t}</button>`).join('')}</nav>`}

function followHtml(){
  const t=today();
  const r=L.filter(c=>last(c)).map(c=>({c,d:addM(last(c),F)})).filter(x=>days(x.d,t)<=30).sort((a,b)=>a.d<b.d?-1:1);
  return `<main><div class="seg">${[3,6,12].map(n=>`<button data-a="fu" data-n="${n}" class="${F===n?'on':''}">${bn(n)} মাস</button>`).join('')}</div>
  <small>সর্বশেষ সার্ভিসের পর ${bn(F)} মাস পূর্ণ হয়েছে বা ৩০ দিনের মধ্যে হবে।</small>
  ${r.length?r.map(({c,d})=>{const n=days(d,t);return `<div class="card" data-a="open" data-id="${c.id}"><div><b>${esc(c.name)}</b><small>${esc(c.code)} · সর্বশেষ: ${dt(last(c))}</small><small class="${n<0?'late':'soon'}">${n<0?bn(-n)+' দিন দেরি':n===0?'আজ':bn(n)+' দিন বাকি'} (${dt(d)})</small></div><a href="tel:${esc(c.phone)}" onclick="event.stopPropagation()"><button class="s">কল</button></a></div>`}).join(''):'<div class="empty">এই মুহূর্তে কোনো ফলোআপ নেই।</div>'}</main>`}

function backHtml(){const lb=localStorage.getItem('lastBackup');return `<main><div class="box"><h3>ব্যাকআপ নিন</h3><p>সব কাস্টমার, সার্ভিস ও ছবি একটি JSON ফাইলে সেভ হবে। ফাইলটি Files/iCloud Drive-এ রাখুন।</p><small>সর্বশেষ ব্যাকআপ: ${lb?dt(lb):'এখনো নেওয়া হয়নি'}</small><div class="row"><button data-a="bk">ব্যাকআপ ফাইল তৈরি করুন</button></div></div>
  <div class="box"><h3>Restore করুন</h3><p>ব্যাকআপ ফাইল বেছে নিলে বর্তমান সব ডেটা মুছে ওই ফাইলের ডেটা বসবে।</p><input type="file" id="rs" accept=".json,application/json"></div>
  <small>মোট কাস্টমার: ${bn(L.length)}</small></main>`}

function detail(c){
  const bill=c.services.reduce((a,s)=>a+s.bill,0),paid=c.services.reduce((a,s)=>a+s.paid,0);
  const ss=[...c.services].sort((a,b)=>a.date<b.date?1:-1);
  return `<main><div class="row" style="margin:10px 0 0"><button class="g" data-a="back">← ফিরে যান</button></div>
  <div class="box"><div class="card" style="border:0;padding:0;margin:0">${c.photo?`<img src="${c.photo}" alt="">`:`<i>${esc(c.name[0]||'?')}</i>`}<div><b>${esc(c.name)}</b><small>${esc(c.code)}</small><small>${esc(c.phone)}</small></div></div><p style="margin:8px 0 0">${esc(c.address)}</p>${c.outdoor||c.floors?`<p style="margin:6px 0 0">${c.outdoor?`আউটডোর: <b>${esc(c.outdoor)}</b>`:''}${c.outdoor&&c.floors?' · ':''}${c.floors?`বাড়ি কত তালা: <b>${esc(c.floors)}</b>`:''}</p>`:''}
  <div class="row"><a href="tel:${esc(c.phone)}"><button style="width:100%">কল</button></a><button class="g" data-a="editc">সম্পাদনা</button><button class="r" data-a="delc">মুছুন</button></div></div>
  <div class="box"><div class="sum"><div><small>মোট বিল</small><b>${tk(bill)}</b></div><div><small>জমা</small><b class="ok">${tk(paid)}</b></div><div><small>বকেয়া</small><b class="${bill-paid>0?'due':''}">${tk(bill-paid)}</b></div></div></div>
  <div class="box"><h3>এসি</h3>${c.acs.map((a,i)=>`<div class="sv"><b>${esc(a.brand)} ${esc(a.model)}</b><small>সিরিয়াল: ${esc(a.serial)||'—'}</small><div class="row"><button class="g s" data-a="edita" data-i="${i}">সম্পাদনা</button><button class="r s" data-a="dela" data-i="${i}">মুছুন</button></div></div>`).join('')||'<small>কোনো এসি যোগ করা হয়নি।</small>'}<div class="row"><button data-a="adda">+ এসি যোগ করুন</button></div></div>
  <div class="box"><h3>সার্ভিসের ইতিহাস</h3>${ss.map(s=>{const i=c.services.indexOf(s);return `<div class="sv"><b>${dt(s.date)}</b> · ${esc(acName(c,s.acId))}<small>${esc(s.note)}</small><small>বিল ${tk(s.bill)} · জমা ${tk(s.paid)} · <span class="${s.bill-s.paid>0?'due':''}">বকেয়া ${tk(s.bill-s.paid)}</span></small><div class="row"><button class="g s" data-a="edits" data-i="${i}">সম্পাদনা</button><button class="r s" data-a="dels" data-i="${i}">মুছুন</button></div></div>`}).join('')||'<small>কোনো সার্ভিস নেই।</small>'}<div class="row"><button data-a="adds">+ সার্ভিস যোগ করুন</button></div></div></main>`}

function render(){
  const c=CUR&&L.find(x=>x.id===CUR);
  let h;
  if(V==='detail'&&c)h=detail(c);
  else{V=V==='detail'?'list':V;h=nav()+(V==='list'?`<main><input id="q" type="search" placeholder="নাম, ফোন, কোড, সিরিয়াল দিয়ে খুঁজুন" value="${esc(Q)}"><div id="lst">${listHtml()}</div></main><button class="fab" data-a="addc" aria-label="নতুন কাস্টমার">+</button>`:V==='follow'?followHtml():backHtml())}
  $('#app').innerHTML=h;
  const q=$('#q');if(q)q.oninput=()=>{Q=q.value;$('#lst').innerHTML=listHtml()};
  const rs=$('#rs');if(rs)rs.onchange=restore;
}

const custF=[{k:'code',l:'কাস্টমার কোড',r:1},{k:'name',l:'নাম',r:1},{k:'phone',l:'ফোন',t:'tel',r:1},{k:'address',l:'ঠিকানা'},{k:'outdoor',l:'এসির আউটডোর কোথায় (একটি টিক দিন)',t:'tick',o:['বারান্দায়','দেওয়ালে']},{k:'floors',l:'বাড়ি কত তালা (যেমন: ১০/৫)'},{k:'photo',l:'ছবি',t:'photo'}];
const acF=[{k:'brand',l:'ব্র্যান্ড',r:1},{k:'model',l:'মডেল'},{k:'serial',l:'সিরিয়াল নম্বর'}];
const svF=c=>[{k:'date',l:'তারিখ',t:'date',r:1},{k:'acId',l:'এসি',t:'select',o:[['','নির্দিষ্ট নয়'],...c.acs.map(a=>[a.id,`${a.brand} ${a.model}`])]},{k:'note',l:'কাজের বিবরণ'},{k:'bill',l:'বিল (৳)',t:'number'},{k:'paid',l:'জমা (৳)',t:'number'}];
const cur=()=>L.find(x=>x.id===CUR);

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,i=+el.dataset.i,c=cur();
  if(a==='tab'){V=el.dataset.v;render()}
  else if(a==='fu'){F=+el.dataset.n;render()}
  else if(a==='open'){CUR=el.dataset.id;V='detail';render();scrollTo(0,0)}
  else if(a==='back'){V='list';CUR=null;render()}
  else if(a==='addc'){const n=L.reduce((m,x)=>Math.max(m,parseInt(x.code.replace(/\D/g,''))||0),0)+1;
    form('নতুন কাস্টমার',custF,{code:'C-'+String(n).padStart(4,'0')},v=>save({id:uid(),...v,acs:[],services:[]}))}
  else if(a==='editc')form('কাস্টমার সম্পাদনা',custF,c,v=>save({...c,...v}));
  else if(a==='delc'){if(confirm('এই কাস্টমার ও তার সব সার্ভিস মুছে যাবে। নিশ্চিত?')){await rq(st('readwrite').delete(c.id));CUR=null;V='list';await load();render()}}
  else if(a==='adda')form('এসি যোগ করুন',acF,{},v=>{c.acs.push({id:uid(),...v});return save(c)});
  else if(a==='edita')form('এসি সম্পাদনা',acF,c.acs[i],v=>{Object.assign(c.acs[i],v);return save(c)});
  else if(a==='dela'){if(confirm('এসিটি মুছবেন?')){c.acs.splice(i,1);save(c)}}
  else if(a==='adds')form('নতুন সার্ভিস',svF(c),{date:today(),bill:0,paid:0},v=>{c.services.push({id:uid(),...v});return save(c)});
  else if(a==='edits')form('সার্ভিস সম্পাদনা',svF(c),c.services[i],v=>{Object.assign(c.services[i],v);return save(c)});
  else if(a==='dels'){if(confirm('সার্ভিসটি মুছবেন?')){c.services.splice(i,1);save(c)}}
  else if(a==='bk'){
    const blob=new Blob([JSON.stringify({app:'accare',version:1,date:today(),customers:L})],{type:'application/json'});
    const f=new File([blob],`accare-backup-${today()}.json`,{type:'application/json'});
    localStorage.setItem('lastBackup',today());
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(_){}}
    else{const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download=f.name;l.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}
    render()}
});

async function restore(e){
  const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());
    if(!Array.isArray(d.customers))throw 0;
    if(!confirm(`${bn(d.customers.length)} জন কাস্টমারের ডেটা Restore হবে। বর্তমান ডেটা মুছে যাবে। নিশ্চিত?`)){e.target.value='';return}
    await rq(st('readwrite').clear());
    for(const c of d.customers)await rq(st('readwrite').put({acs:[],services:[],...c}));
    await load();V='list';render();alert('Restore সম্পন্ন হয়েছে।')}
  catch(_){alert('ফাইলটি সঠিক ব্যাকআপ ফাইল নয়।');e.target.value=''}
}

open().then(load).then(render);
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
